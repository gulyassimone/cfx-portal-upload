name: 'CFX Portal Upload'
description:
  'Uploads assets to CFX Portal with support for escrowed and open source
  versions'
author: 'Lukas Leisten'

branding:
  icon: 'upload-cloud'
  color: 'gray-dark'

inputs:
  cookie:
    description: 'Your Forum Account Cookie (_t cookie from forum.cfx.re)'
    required: false
  chunkSize:
    description:
      'Upload chunk size in bytes (default: 2MB, recommended: 5-20MB for large
      files)'
    required: false
    default: 2097152
  maxRetries:
    description: 'Maximum number of login retries'
    required: false
    default: 3
  skipUpload:
    description: 'Skip upload and only test authentication'
    required: false
    default: false
  # Simple single asset upload
  assetId:
    description: 'Asset ID for simple single upload'
    required: false
  assetName:
    description: 'Asset name for simple single upload (will lookup ID)'
    required: false
  makeZip:
    description: 'Automatically create ZIP from repository'
    required: false
    default: true
  zipPath:
    description: 'Path to pre-made ZIP file'
    required: false
  resourcePath:
    description:
      'Path to resource folder (for monorepos with multiple resources)'
    required: false
  # Version configurations
  escrowed:
    description: 'Escrowed version config (YAML: asset_id, asset_name)'
    required: false
  openSource:
    description: 'Open source version config (YAML: asset_id, asset_name)'
    required: false

  # Deploy configuration (optional)
  deploy:
    description: 'Enable deploy to server after upload'
    required: false
    default: 'false'
  ssh_host:
    description: 'SSH host address for deployment'
    required: false
  ssh_user:
    description: 'SSH username'
    required: false
  ssh_key:
    description: 'SSH private key'
    required: false
  ssh_port:
    description: 'SSH port'
    required: false
    default: '22'
  deploy_path:
    description: 'Path to resources folder on server'
    required: false
    default: '~/fivem/resources'
  deploy_resource_name:
    description: 'Resource folder name on server (defaults to asset_name)'
    required: false
  deploy_backup_path:
    description: 'Backup directory outside the resources directory'
    required: false
    default: '~/.cfx-portal-upload/backups'
  rollback:
    description: 'Restore a selected deployment backup instead of uploading'
    required: false
    default: 'false'
  rollback_backup:
    description: 'Backup identifier to restore when rollback is enabled'
    required: false

  # Discord notifications (optional)
  discord_webhook:
    description: 'Discord webhook URL for notifications'
    required: false

runs:
  using: node20
  main: dist/index.js
